<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COFFEE — Київська кавʼярня</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter, sans-serif;background:#0f0f0f;color:#e8e8e8;line-height:1.6}
    .container{max-width:800px;margin:auto;padding:20px}
    h2{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:1rem}
    input,textarea{width:100%;padding:10px;margin-top:6px;margin-bottom:10px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#fff;font-family:inherit}
    button{background:linear-gradient(135deg,#c2793f,#9a5f2f);border:none;color:#fff;padding:12px 20px;font-weight:700;border-radius:10px;cursor:pointer;transition:.3s all}
    button:hover{filter:brightness(1.1)}
    #status{margin-top:10px;opacity:0;transition:opacity .4s ease}
  </style>
</head>
<body>
  <section id="contact">
    <div class="container">
      <h2>Контакти та бронювання</h2>
      <p>Київ, вул. Олеся Гончара, 50 (Лукʼянівка)<br>Пн—Нд: 08:00—21:00</p>
      <p><a href="tel:+380630000000" style="color:#c2793f">+380 (63) 000-00-00</a> · <a href="mailto:hello@coffee.kyiv.ua" style="color:#c2793f">hello@coffee.kyiv.ua</a></p>

      <form id="book" action="https://formspree.io/f/mzzpykjp" method="POST">
        <label>Імʼя<input type="text" name="name" required placeholder="Ваше імʼя"></label>
        <label>Телефон<input type="tel" name="phone" required placeholder="+380..."></label>
        <label>Дата<input type="date" id="date" name="date" required></label>
        <label>Час<input type="time" name="time" required></label>
        <label>Коментар<textarea name="msg" rows="3" placeholder="Кількість гостей, побажання..."></textarea></label>
        <input type="hidden" name="_replyto" value="st9838892@stud.duikt.edu.ua">
        <button type="submit">Забронювати столик</button>
        <div id="status"></div>
      </form>
    </div>
  </section>
  <script>
    // автозаповнення дати сьогодні
    const dateInput=document.getElementById('date');
    const today=new Date().toISOString().split('T')[0];
    if(dateInput) dateInput.value=today;

    const form=document.getElementById('book');
    const status=document.getElementById('status');

    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const data=new FormData(form);
      try{
        const res=await fetch(form.action,{method:'POST',body:data,headers:{Accept:'application/json'}});
        if(res.ok){
          status.textContent='✅ Дякуємо! Бронювання відправлено.';
          status.style.color='#2ecc71';
          form.reset();
        }else{
          status.textContent='⚠️ Помилка при відправці. Спробуйте ще раз.';
          status.style.color='#ff6b6b';
        }
      }catch(err){
        status.textContent='⚠️ Проблема з мережею. Спробуйте пізніше.';
        status.style.color='#ff6b6b';
      }
      status.style.opacity=1;
      setTimeout(()=>status.style.opacity=0,4000);
    });
  </script>
</body>
</html>
